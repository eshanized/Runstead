name: Runstead CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test, Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit test suite (offline demo state)
        run: npm test
        env:
          SKIP_DB_TESTS: "1"

      - name: Production build
        run: npm run build

  database-rls-tests:
    name: PostgreSQL Migrations & Multi-Tenant RLS
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runstead_admin
          POSTGRES_PASSWORD: admin_secret_ci
          POSTGRES_DB: runstead_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://runstead_admin:admin_secret_ci@localhost:5432/runstead_test?schema=public"
      DIRECT_URL: "postgresql://runstead_admin:admin_secret_ci@localhost:5432/runstead_test?schema=public"
      DATABASE_TEST_URL: "postgresql://runstead_admin:admin_secret_ci@localhost:5432/runstead_test?schema=public"
      APP_DATABASE_URL: "postgresql://runstead_app:app_secret_ci@localhost:5432/runstead_test?schema=public"
      APP_DATABASE_TEST_URL: "postgresql://runstead_app:app_secret_ci@localhost:5432/runstead_test?schema=public"
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Provision restricted application role
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U runstead_admin -d runstead_test -c "CREATE ROLE runstead_app WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'app_secret_ci';"

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply versioned database migrations
        run: npm run db:migrate

      - name: Run PostgreSQL Multi-Tenant RLS Integration Suite
        run: npm run test:db
